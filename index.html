<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <header>
    <h1>🌤️ ATMOS</h1>
    <div class="search">
      <input type="text" id="cityInput" placeholder="busca tu ciudad" />
      <button id="searchBtn">🔍</button>
    </div>
  </header>

  <main>
    <section id="current" class="card">
      <h2 class="section-title">
        <span class="icon"> ☀️ </span>
        El tiempo ahora
      </h2>
    </section>

    <section id="hourly" class="card">
      <h2 class="section-title">
        <span class="icon"> 🕒 </span>
        El tiempo hoy
      </h2>
    </section>

    <section id="daily" class="card">
      <h2 class="section-title">
        <span class="icon"> 📆 </span>
        El tiempo en los próximos días
      </h2>
    </section>
  </main>

  <footer>
    <p>Powered by Weather App ☁️</p>

    <div class="cloud-carousel">
      <div class="cloud-track">
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" />
        <img src="https://images.unsplash.com/photo-1527482797697-8795b05a13fe" />
        <img src="https://images.unsplash.com/photo-1499346030926-9a72daac6c63" />
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba" />
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" />
        <img src="https://images.unsplash.com/photo-1527482797697-8795b05a13fe" />
        <img src="https://images.unsplash.com/photo-1499346030926-9a72daac6c63" />
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba" />
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee" />
        <img src="https://images.unsplash.com/photo-1527482797697-8795b05a13fe" />
        <img src="https://images.unsplash.com/photo-1499346030926-9a72daac6c63" />
        <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba" />
      </div>
    </div>
  </footer>

<script src="index.js"></script>
</body>
</html>
